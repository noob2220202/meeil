name: meeil
description: "염소 우체부 편지 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  kakao_flutter_sdk_user: ^2.0.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/illustrations/
    - assets/stickers/
    - assets/sounds/
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Regular.ttf
        - asset: assets/fonts/Gaegu-Bold.ttf
          weight: 700
